# Development dependencies. The API, worker and web app run from the repository
# (see docs/platform.md); this file provides what they talk to.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: coe-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Optional: receives the traces and metrics the API and worker emit.
  # Enable with: docker compose --profile observability up -d
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: coe-otel
    profiles: ["observability"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC — set Observability:OtlpEndpoint to http://localhost:4317
      - "4318:4318"   # OTLP HTTP

volumes:
  mssql-data:
