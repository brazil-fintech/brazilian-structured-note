name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest

    # The database tests run against this; without it they skip rather than fail.
    #
    # The password comes from the COE_SQL_PASSWORD Actions secret. The literal below is what a
    # fork without that secret falls back to, so a pull request still runs the database tests:
    # it names a container that lives for one job on one runner and is never reachable from
    # outside it. Nothing deployed reads it — deploy/docker-compose.hosted.yml has no default
    # at all and refuses to start without the secret. The health probe below reads the password
    # from the container's own environment rather than repeating it; a password with spaces or
    # shell metacharacters would not survive that, so generate one from base64.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.COE_SQL_PASSWORD || 'Coe_Ci_Throwaway_2026!' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Compiles every domain file in domain/, so a bad figure edit fails here
      # rather than quarantining the figure in production. Each test run creates and
      # drops its own database on the service container above.
      - run: dotnet test --no-build --configuration Release --verbosity normal
        env:
          COE_TEST_SQL: "Server=localhost,1433;User Id=sa;Password=${{ secrets.COE_SQL_PASSWORD || 'Coe_Ci_Throwaway_2026!' }};TrustServerCertificate=True;Encrypt=True"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
