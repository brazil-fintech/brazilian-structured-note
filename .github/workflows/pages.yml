# Publishes the booking screen to GitHub Pages, so the app is reachable without building it.
# The page carries no API of its own: it reads config.js at load, and a visitor can point it
# at their own instance with ?api=https://host/api (remembered afterwards). Set the repository
# variable COE_API_BASE_URL to give the page a default API; without it the page ships pointing
# nowhere and says so, which is the honest answer for a repository with no API deployed.
#
# Pages has to be turned on by hand once, under Settings → Pages → Source → "GitHub Actions".
# The workflow cannot do it: GITHUB_TOKEN can deploy to a Pages site but not create one, and
# until someone flips that setting this workflow builds and tests the app and stops short of
# deploying rather than failing the push.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one half-way: the live site is the artefact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    outputs:
      pages_enabled: ${{ steps.enabled.outputs.pages }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Asking first, because actions/configure-pages fails the job outright when the site
      # does not exist, and a repository that has never had Pages turned on is not a broken
      # build — it is a setting nobody has flipped yet.
      - name: Is Pages turned on for this repository?
        id: enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo 'pages=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pages=false' >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is off::The screen was built and tested but not published. Turn Pages on under Settings → Pages → Source → \"GitHub Actions\", then re-run this workflow."
          fi

      - name: Configure Pages
        id: pages
        if: steps.enabled.outputs.pages == 'true'
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # A project page is served from /<repository>/, so the asset URLs need that prefix.
      # The fallback is what configure-pages would have reported, so the build that runs with
      # Pages off is the same build that gets deployed once someone turns Pages on.
      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/
        run: npm run build

      # Only when there is an API to name. The old default here was http://localhost:5080/api,
      # which is not this repository's API but whatever happens to run on the machine of whoever
      # opens the page: every visitor got ERR_CONNECTION_REFUSED against their own computer.
      # Left unset, the page falls back to /api on its own origin, finds nothing there either,
      # and says so — offering the box that points it at a real instance.
      - name: Point the page at an API
        env:
          API_BASE_URL: ${{ vars.COE_API_BASE_URL }}
        run: |
          if [ -n "${API_BASE_URL}" ]; then
            cat > dist/config.js <<JS
          // Written by .github/workflows/pages.yml from the COE_API_BASE_URL repository variable.
          window.__COE_CONFIG__ = { apiBaseUrl: '${API_BASE_URL}' };
          JS
          else
            cat > dist/config.js <<'JS'
          // No COE_API_BASE_URL repository variable is set, so the published page ships without a
          // default API. A visitor points it at one with ?api=https://host/api, or in the box the
          // screen offers when the first call fails.
          window.__COE_CONFIG__ = {};
          JS
            echo "::warning title=The published page has no API::Set the COE_API_BASE_URL repository variable (Settings → Secrets and variables → Actions → Variables) to give the page a default API. Until then visitors have to supply one themselves."
          fi
          # One page and no router, but a deep link or a refresh should still land on it.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        if: steps.enabled.outputs.pages == 'true'
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
