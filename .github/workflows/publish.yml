# Publishes the three runnable pieces — API, worker and web — as container images on GitHub's
# own registry, so running the platform is a pull rather than a build. Pull requests build the
# same images without pushing, which is what keeps the Dockerfiles from rotting.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'deploy/**'
      - 'src/**'
      - 'web/**'
      - 'db/**'
      - 'domain/**'
      - 'reference/**'
      - 'Directory.*.props'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/api.Dockerfile
            title: COE booking API
          - name: worker
            dockerfile: deploy/worker.Dockerfile
            title: COE ingestion worker
          - name: web
            dockerfile: deploy/web.Dockerfile
            title: COE booking web app

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Anonymous pulls need the package made public once, under
      # Packages → coe/<name> → Package settings → Change visibility.
      - name: Sign in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Booking platform for the Brazilian COE (Certificado de Operações Estruturadas)
            org.opencontainers.image.licenses=MIT

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image: the .NET restore layer and the npm one share nothing.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false

  # Proves the published images are runnable as published: the compose file people are pointed
  # at, the tag this run just pushed, and a SQL Server that has never seen this schema.
  smoke:
    needs: images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The COE_SQL_PASSWORD secret when the repository has one; otherwise a password that
      # exists for the length of this job and is thrown away with the runner.
      - name: Pick the password for the throwaway SQL Server
        id: sql
        env:
          CONFIGURED: ${{ secrets.COE_SQL_PASSWORD }}
        run: |
          password="$CONFIGURED"
          if [ -z "$password" ]; then
            password="$(openssl rand -base64 24 | tr -d '/+=')aA1!"
          fi
          echo "::add-mask::$password"
          echo "password=$password" >> "$GITHUB_OUTPUT"

      - name: Start the stack from the images this run pushed
        env:
          COE_SQL_PASSWORD: ${{ steps.sql.outputs.password }}
          COE_TAG: sha-${{ github.sha }}
        run: docker compose --file deploy/docker-compose.hosted.yml up --detach

      - name: The API answers, and the worker filled its catalogue
        run: |
          set -euo pipefail
          # The worker compiles all 88 figures on its first pass; the API is up well before that.
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5080/health/ready > /dev/null; then break; fi
            sleep 5
          done
          curl --fail --silent http://localhost:5080/health/ready > /dev/null

          for attempt in $(seq 1 60); do
            bookable=$(curl --fail --silent http://localhost:5080/api/figures/catalogue \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["coverage"]["bookable"])' || echo 0)
            if [ "$bookable" -gt 0 ]; then break; fi
            sleep 5
          done
          echo "bookable figures: $bookable"
          [ "$bookable" -gt 0 ]

          # And the same catalogue through nginx, which is the path a browser takes.
          curl --fail --silent http://localhost:8080/ > /dev/null
          curl --fail --silent http://localhost:8080/api/figures/catalogue > /dev/null

      - name: Logs
        if: failure()
        env:
          COE_SQL_PASSWORD: ${{ steps.sql.outputs.password }}
        run: docker compose --file deploy/docker-compose.hosted.yml logs --tail 200

      - name: Stop
        if: always()
        env:
          COE_SQL_PASSWORD: ${{ steps.sql.outputs.password }}
        run: docker compose --file deploy/docker-compose.hosted.yml down --volumes
